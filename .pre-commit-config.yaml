minimum_prek_version: "0.3.8"
default_install_hook_types:
  - pre-commit
  - pre-push
default_language_version:
  python: "3.14"
exclude: '^(\.venv|out|dist|build)/'

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: ensure newline at end of file
      - id: check-json
        name: validate JSON syntax
      - id: check-yaml
        name: validate YAML syntax
      - id: check-toml
        name: validate TOML syntax
      - id: check-merge-conflict
        name: check for merge conflicts
      - id: check-case-conflict
        name: check case conflicts
      - id: mixed-line-ending
        name: enforce LF line endings

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        name: lint Python
        args: [--fix, --config=tools/pyproject.toml]
      - id: ruff-format
        name: format Python
        args: [--config=tools/pyproject.toml]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: format Markdown
        types: [markdown]
        exclude: '^\.github/|^docs/reference/snippets\.md$'
        additional_dependencies:
          - mdformat-gfm
          - "mdformat-mkdocs[recommended]"

  - repo: https://github.com/owenlamont/uv-secure
    rev: 0.17.1
    hooks:
      - id: uv-secure
        name: scan uv.lock for vulnerabilities

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: check for common misspellings
        files: '\.(py|md|ya?ml|toml)$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: check shell scripts
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: prettier
        name: format JS/TS/JSON with Prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [ts, javascript, json]
      - id: pytest
        name: run Python tests
        entry: uv run --project tools pytest -c tools/pyproject.toml tools/tests
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
      - id: pyrefly
        name: type check Python
        entry: uv run --project tools pyrefly check --config tools/pyproject.toml
        language: system
        pass_filenames: false
        require_serial: true
      - id: eslint
        name: lint TypeScript/JavaScript
        entry: npm run lint
        language: system
        pass_filenames: false
        types_or: [ts, javascript]
        stages: [pre-commit]
      - id: check-types
        name: type check TypeScript
        entry: npm run check-types
        language: system
        pass_filenames: false
        types_or: [ts]
        stages: [pre-push]
      - id: test-unit
        name: run TypeScript unit tests
        entry: npm run test:unit
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: knip
        name: check for dead code
        entry: npm run knip
        language: system
        pass_filenames: false
        stages: [pre-push]
