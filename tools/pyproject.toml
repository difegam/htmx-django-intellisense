[project]
name = "htmx-django-intellisense"
version = "0.1.0"
description = "Developer tooling for HTMX Django IntelliSense"
readme = "README.md"
authors = [{ name = "Diego Gamboa", email = "difegam3@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.22.5",
    "httpx2>=2.9.1",
    "packaging>=26.3",
    "pydantic>=2.13.4",
]

[project.scripts]
htmx-tools = "htmx_django_intellisense.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["prek>=0.4.13", "pyrefly>=1.2.0", "pytest>=9.1.1", "ruff>=0.16.1"]
docs = ["zensical>=0.0.53"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
force-exclude = true
extend-exclude = [
    ".venv",
    ".vscode-test",
    "logs",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH", "C4", "PERF", "RUF", "S"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
# Explicit so import grouping is identical whether ruff is invoked as `ruff check tools`
# (CI) or with passed file paths (pre-commit hook).
known-first-party = ["htmx_django_intellisense"]

[tool.ruff.lint.per-file-ignores]
# `**/`-anchored so the ignores match regardless of how ruff resolves the project root
# (CI `ruff check tools` vs. pre-commit passing `tools/tests/...` paths).
"**/catalog.py" = ["E501"]
"**/tests/**" = ["S101"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"
