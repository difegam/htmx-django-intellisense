version: 2
updates:
  # npm dependencies for the VS Code extension
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @typescript-eslint does not support TypeScript 7 yet (npm ERESOLVE).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/vscode must not exceed engines.vscode in package.json (vsce refuses to package).
      - dependency-name: "@types/vscode"
    open-pull-requests-limit: 5

  # Python tooling under tools/ (uv-managed, uv.lock as the lockfile)
  - package-ecosystem: uv
    directory: "/tools"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # GitHub Actions used across workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
