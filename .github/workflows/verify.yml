name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - name: Set up Python
        working-directory: tools
        run: uv python install

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --project tools --frozen --all-groups

      - name: Lint TypeScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check TypeScript
        run: npm run check-types

      - name: Dead-code check
        run: npm run knip

      - name: Lint Python
        run: |
          uv run --project tools ruff check tools
          uv run --project tools ruff format --check tools

      - name: Type-check Python
        run: uv run --project tools pyrefly check --config tools/pyproject.toml

      - name: Validate extension data
        run: uv run --project tools pytest -c tools/pyproject.toml tools/tests

      - name: Run TypeScript unit tests with coverage
        run: npm run test:coverage

      - name: Verify generated artifacts are current
        run: |
          npm run build-data
          npm run build-snippets
          git diff --exit-code -- \
            htmx.catalog.json \
            snippets/django-htmx.json \
            docs/reference/snippets.md

      - name: Validate documentation
        run: uv run --project tools --group docs zensical build --clean --strict

      - name: Verify HTMX pins are current
        run: uv run --project tools htmx-tools check-pins
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package and inspect VSIX
        run: |
          npm run package
          npx vsce ls --tree

      - name: Build Python package
        run: uv build --project tools

  extension-tests:
    name: Extension host (VS Code ${{ matrix.vscode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the declared engines.vscode minimum and the latest stable build.
        vscode: ["1.90.2", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run VS Code extension-host tests
        run: xvfb-run -a npm run test:extension
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  package-smoke:
    name: Packaged VSIX smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install the packaged VSIX into a clean profile and smoke-test it
        run: xvfb-run -a npm run test:smoke
