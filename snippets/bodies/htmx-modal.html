<button type="button" hx-get="{% url '${1:modal-view}' %}"
        hx-target="#${2:modal}" hx-swap="innerHTML"
        aria-haspopup="dialog" aria-controls="${2:modal}">
  ${3:Open modal}
</button>
<div id="${2:modal}" class="modal-container" role="dialog" aria-modal="true" aria-labelledby="${2:modal}-title"></div>
