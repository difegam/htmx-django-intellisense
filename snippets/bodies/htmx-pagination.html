<section id="${1:results}">
    $0
    <nav aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}" hx-get="?page={{ page_obj.previous_page_number }}"
               hx-target="#${1:results}" hx-swap="outerHTML" hx-push-url="true">Previous</a>
        {% endif %}
        <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}" hx-get="?page={{ page_obj.next_page_number }}"
               hx-target="#${1:results}" hx-swap="outerHTML" hx-push-url="true">Next</a>
        {% endif %}
    </nav>
</section>
